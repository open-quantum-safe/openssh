# For testing, you can set variables in your repo (Repo -> Settings ->
# Security -> Actions -> Variables) to restrict the tests that are run
# The supported variables are:
#
# RUN_ONLY_PLATFORM: run only tests on specified platform.

name: CI VM
on:
  push:
    paths: [ '**.c', '**.h', '**.m4', '**.sh', '**/Makefile.in', 'configure.ac', '.github/configs', '.github/workflows/vm.yml' ]
  pull_request:
    paths: [ '**.c', '**.h', '**.m4', '**.sh', '**/Makefile.in', 'configure.ac', '.github/configs', '.github/workflows/vm.yml' ]

jobs:
  dragonflybsd:
    name: "dragonflybsd-${{ matrix.target }}"
    if: github.repository != 'openssh/openssh-portable-selfhosted' && (vars.RUN_ONLY_PLATFORM == '' || vars.RUN_ONLY_PLATFORM == 'dragonflybsd')
    strategy:
      fail-fast: false
      matrix:
        target:
          - "6.4.2"
        config: [default]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # main
    - name: autoreconf
      run: sh -c autoreconf

    - name: start DragonFlyBSD ${{ matrix.target }} VM
      uses: vmactions/dragonflybsd-vm@4ba8127bd95c94b66fc4b885e37c99955ba308ea # v1
      with:
        release: ${{ matrix.target }}
        usesh: true
        prepare: |
          timeout 600 pkg install -y sudo || pkg install -y sudo
          pw useradd builder -m
          echo "builder ALL=(ALL:ALL) NOPASSWD: ALL" >>/usr/local/etc/sudoers
          mkdir -p /var/empty /usr/local/etc
          chflags noschg /var/empty 2>/dev/null || true
          chmod 0755 /var/empty
          cp $GITHUB_WORKSPACE/moduli /usr/local/etc/moduli

    - name: set file perms
      shell: dragonflybsd {0}
      run: chown -R builder $GITHUB_WORKSPACE
    - name: Clone liboqs
      shell: dragonflybsd {0}
      run: cd $GITHUB_WORKSPACE && sudo -u builder bash ./oqs-scripts/clone_liboqs.sh
    - name: Build liboqs
      shell: dragonflybsd {0}
      run: cd $GITHUB_WORKSPACE && sudo -u builder bash ./oqs-scripts/build_liboqs.sh
    - name: Build OpenSSH
      shell: dragonflybsd {0}
      run: |
        cd $GITHUB_WORKSPACE
        env VMCI=true WITH_OPENSSL=true bash ./oqs-scripts/build_openssh.sh
        chown -R builder oqs-test/tmp
    - name: Run tests documented to pass
      shell: dragonflybsd {0}
      run: cd $GITHUB_WORKSPACE && sudo -u builder bash ./oqs-test/run_tests.sh
    - name: Ensure we have the ssh and sshd syntax right once for each algorithm
      shell: dragonflybsd {0}
      run: cd $GITHUB_WORKSPACE && sudo -u builder make clean
    - name: "PAM: make"
      shell: dragonflybsd {0}
      run: cd $GITHUB_WORKSPACE && sudo -u builder make -j4
    - name: "PAM: make t-exec"
      shell: dragonflybsd {0}
      run: |
        cd $GITHUB_WORKSPACE
        sudo -u builder env SUDO=sudo SSHD_CONFOPTS="UsePam yes" make t-exec

  freebsd:
    name: "freebsd-${{ matrix.target }}"
    if: github.repository != 'openssh/openssh-portable-selfhosted' && (vars.RUN_ONLY_PLATFORM == '' || vars.RUN_ONLY_PLATFORM == 'freebsd')
    strategy:
      fail-fast: false
      matrix:
        target:
          - "12.4"
          - "13.5"
          - "14.4"
          - "15.0"
        config: [default]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # main
    - name: autoreconf
      run: sh -c autoreconf

    - name: start FreeBSD ${{ matrix.target }} VM
      uses: vmactions/freebsd-vm@b84ab5559b5a1bb4b8ee2737d2506a16e1737636 # v1
      with:
        release: ${{ matrix.target }}
        usesh: true
        prepare: |
          case $(uname -r) in
          12.*)
            timeout 600 ftp ftp://ftp.sudo.ws/pub/sudo/sudo-1.8.32.tar.gz || \
              ftp ftp://ftp.sudo.ws/pub/sudo/sudo-1.8.32.tar.gz
            tar xfz sudo-1.8.32.tar.gz
            (cd sudo-1.8.32 && ./configure --sysconfdir=/usr/local/etc && make && make install)
            ;;
          *)
            timeout 600 pkg install -y sudo || pkg install -y sudo
            ;;
          esac
          openssl rand -base64 9 >$GITHUB_WORKSPACE/regress/password
          pw useradd builder -m -h0 <$GITHUB_WORKSPACE/regress/password
          chown builder $GITHUB_WORKSPACE/regress/password
          echo "builder ALL=(ALL:ALL) NOPASSWD: ALL" >>/usr/local/etc/sudoers
          mkdir -p /var/empty /usr/local/etc
          cp $GITHUB_WORKSPACE/moduli /usr/local/etc/moduli

    - name: set file perms
      shell: freebsd {0}
      run: chown -R builder $GITHUB_WORKSPACE
    - name: Clone liboqs
      shell: freebsd {0}
      run: cd $GITHUB_WORKSPACE && sudo -u builder bash ./oqs-scripts/clone_liboqs.sh
    - name: Build liboqs
      shell: freebsd {0}
      run: cd $GITHUB_WORKSPACE && sudo -u builder bash ./oqs-scripts/build_liboqs.sh
    - name: Build OpenSSH
      shell: freebsd {0}
      run: |
        cd $GITHUB_WORKSPACE
        sudo -u builder env SUDO=sudo make tests SKIP_LTESTS=scp3

    - name: "PAM: configure"
      shell: freebsd {0}
      run: cd $GITHUB_WORKSPACE && sudo -u builder bash ./oqs-test/run_tests.sh
    - name: Ensure we have the ssh and sshd syntax right once for each algorithm
      shell: freebsd {0}
      run: cd $GITHUB_WORKSPACE && sudo -u builder make clean
    - name: "PAM: make"
      shell: freebsd {0}
      run: cd $GITHUB_WORKSPACE && sudo -u builder make -j4
    - name: "PAM: make t-exec UsePAM=no"
      shell: freebsd {0}
      run: |
        cd $GITHUB_WORKSPACE
        sudo -u builder env SUDO=sudo make t-exec SKIP_LTESTS=scp3
    - name: "PAM: make t-exec UsePAM=yes"
      shell: freebsd {0}
      run: |
        cd $GITHUB_WORKSPACE
        cp regress/password regress/kbdintpw
        sudo -u builder env SUDO=sudo TEST_SSH_SSHD_CONFOPTS="UsePam yes" make t-exec SKIP_LTESTS=scp3


  netbsd:
    name: "netbsd-${{ matrix.target }}"
    if: github.repository != 'openssh/openssh-portable-selfhosted' && (vars.RUN_ONLY_PLATFORM == '' || vars.RUN_ONLY_PLATFORM == 'netbsd')
    strategy:
      fail-fast: false
      matrix:
        target:
          # NetBSD 9.x package repos are unsupported for build dependency installs.
          # - "9.0"
          # - "9.4"
          - "10.0"
          - "10.1"
        config: [default]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # main
    - name: autoreconf
      run: sh -c autoreconf

    - name: start NetBSD ${{ matrix.target }} VM
      uses: vmactions/netbsd-vm@99816dccf75edf233ed6cd00a159e3a5b85ea373 # v1
      with:
        release: ${{ matrix.target }}
        usesh: true
        sync: scp
        copyback: false
        prepare: |
          case "$(uname -r)" in
          9.*) export PKG_PATH="ftp://ftp.NetBSD.org/pub/pkgsrc/packages/NetBSD/$(uname -p)/9.0_2026Q1/All" ;;
          esac
          timeout 600 /usr/sbin/pkg_add sudo || /usr/sbin/pkg_add sudo
          openssl rand -base64 9 >$GITHUB_WORKSPACE/regress/password
          pw=$(tr -d '\n' <$GITHUB_WORKSPACE/regress/password | pwhash)
          /usr/sbin/useradd -m -p "${pw}" builder
          echo "builder ALL=(ALL:ALL) NOPASSWD: ALL" >>/usr/pkg/etc/sudoers
          mkdir -p /var/empty /usr/local/etc
          cp $GITHUB_WORKSPACE/moduli /usr/local/etc/moduli

    - name: Clone liboqs
      shell: netbsd {0}
      run: |
        cd $GITHUB_WORKSPACE
        sudo -u builder env SUDO=sudo make tests

    - name: "PAM: configure"
      shell: netbsd {0}
      run: cd $GITHUB_WORKSPACE && sudo -u builder ./configure --with-pam
    - name: "PAM: make clean"
      shell: netbsd {0}
      run: cd $GITHUB_WORKSPACE && sudo -u builder make clean
    - name: "PAM: make"
      shell: netbsd {0}
      run: cd $GITHUB_WORKSPACE && sudo -u builder make -j4
    - name: "PAM: make t-exec UsePAM=no"
      shell: netbsd {0}
      run: |
        cd $GITHUB_WORKSPACE
        sudo -u builder env SUDO=sudo make t-exec
    - name: "PAM: make t-exec UsePAM=yes"
      shell: netbsd {0}
      run: |
        cd $GITHUB_WORKSPACE
        cp regress/password regress/kbdintpw
        sudo -u builder env SUDO=sudo TEST_SSH_SSHD_CONFOPTS="UsePam yes" make t-exec


  omnios:
    name: "omnios-${{ matrix.target }}"
    if: github.repository != 'openssh/openssh-portable-selfhosted' && (vars.RUN_ONLY_PLATFORM == '' || vars.RUN_ONLY_PLATFORM == 'omnios')
    strategy:
      fail-fast: false
      matrix:
        target:
          - "r151056-build"
          - "r151058-build"
        config: [default]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # main
    - name: autoreconf
      run: sh -c autoreconf

    - name: start OmniOS ${{ matrix.target }} VM
      uses: vmactions/omnios-vm@7f2be0b927aad1a78498c8aeeac4c4ce1fabd322 # v1
      with:
        release: ${{ matrix.target }}
        usesh: true
        prepare: |
          set -x
          if [ ! -x $(which gcc 2>/dev/null) ]; then
            timeout 900 pfexec pkg refresh || pfexec pkg refresh
            timeout 900 pfexec pkg install build-essential || pfexec pkg install build-essential
          fi
          useradd -m builder
          sed -e "s/^root.*ALL$/root ALL=(ALL) NOPASSWD: ALL/" /etc/sudoers >>/tmp/sudoers
          mv /tmp/sudoers /etc/sudoers
          echo "builder ALL=(ALL) NOPASSWD: ALL" >>/etc/sudoers
          mkdir -p /var/empty /usr/local/etc
          cp $GITHUB_WORKSPACE/moduli /usr/local/etc/moduli

    - name: Clone liboqs
      shell: omnios {0}
      run: |
        cd $GITHUB_WORKSPACE
        chown -R builder .
        sudo -u builder bash ./oqs-scripts/clone_liboqs.sh
    - name: Build liboqs
      shell: omnios {0}
      run: |
        cd $GITHUB_WORKSPACE
        chown -R builder .
        sudo -u builder env LIBOQS_CMAKE_ARGS="-DOQS_PERMIT_UNSUPPORTED_ARCHITECTURE=ON" \
          bash ./oqs-scripts/build_liboqs.sh
    - name: Build OpenSSH
      shell: omnios {0}
      run: |
        cd $GITHUB_WORKSPACE
        chown -R builder .
        sed 's/make -j2/make -j 2/g' ./oqs-scripts/build_openssh.sh |
          sudo -u builder env VMCI=true WITH_OPENSSL=true bash
    - name: Run tests documented to pass
      shell: omnios {0}
      run: cd $GITHUB_WORKSPACE && chown -R builder . && sudo -u builder bash ./oqs-test/run_tests.sh
    - name: Ensure we have the ssh and sshd syntax right once for each algorithm
      shell: omnios {0}
      run: |
        cd $GITHUB_WORKSPACE
        chown -R builder .
        sudo -u builder python3 oqs-test/try_connection.py doone


  openbsd:
    name: "openbsd-${{ matrix.target }}"
    if: github.repository != 'openssh/openssh-portable-selfhosted' && (vars.RUN_ONLY_PLATFORM == '' || vars.RUN_ONLY_PLATFORM == 'openbsd')
    strategy:
      fail-fast: false
      matrix:
        target:
          # OpenBSD older package repos are unsupported for build dependency installs.
          # - '7.5'
          # - "7.6"
          - "7.7"
          - "7.8"
          - "7.9"
        config: [default]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # main
    - name: autoreconf
      run: sh -c autoreconf

    - name: start OpenBSD ${{ matrix.target }} VM
      uses: vmactions/openbsd-vm@18edb32f4e48dae5865d7b8b3a9587bc01218a20 # v1
      with:
        release: ${{ matrix.target }}
        usesh: true
        prepare: |
          pkg_add autoconf%2.71 automake%1.16 bash cmake git ninja python%3
          useradd -m builder
          echo "permit nopass keepenv root" >/etc/doas.conf
          echo "permit nopass keepenv builder" >>/etc/doas.conf
          ls -l /etc/doas.conf
          chown root:wheel /etc/doas.conf
          chmod 644 /etc/doas.conf
          mkdir -p /var/empty /usr/local/etc
          cp $GITHUB_WORKSPACE/moduli /usr/local/etc/moduli

    - name: Clone liboqs
      shell: openbsd {0}
      run: |
        cd $GITHUB_WORKSPACE
        chown -R builder .
        doas -u builder bash ./oqs-scripts/clone_liboqs.sh
    - name: Build liboqs
      shell: openbsd {0}
      run: |
        cd $GITHUB_WORKSPACE
        chown -R builder .
        doas -u builder env LIBOQS_CMAKE_ARGS="-DOQS_BUILD_ONLY_LIB=ON -DOQS_USE_OPENSSL=OFF" \
          bash ./oqs-scripts/build_liboqs.sh
        (cd oqs/lib && ln -sf liboqs.so.*.*.* liboqs.so)
    - name: Build OpenSSH
      shell: openbsd {0}
      run: |
        cd $GITHUB_WORKSPACE
        chown -R builder .
        doas -u builder env PATH="/usr/local/bin:$PATH" OPENSSL_SYS_DIR=/usr \
          AUTOCONF_VERSION=2.71 AUTOMAKE_VERSION=1.16 VMCI=true WITH_OPENSSL=true \
          bash ./oqs-scripts/build_openssh.sh
    - name: Run tests documented to pass
      shell: openbsd {0}
      # TODO: Investigate further ssh-tty regression test for openbsd.
      run: |
        cd $GITHUB_WORKSPACE
        chown -R builder .
        sed 's/SKIPPED_DUE_TO_CERTIFIED_KEYS}"/SKIPPED_DUE_TO_CERTIFIED_KEYS} ssh-tty"/' \
          ./oqs-test/run_tests.sh | doas -u builder bash
    - name: Ensure we have the ssh and sshd syntax right once for each algorithm
      shell: openbsd {0}
      run: |
        cd $GITHUB_WORKSPACE
        chown -R builder .
        doas -u builder python3 oqs-test/try_connection.py doone


  openbsd-current-upstream:
    # This job runs the OQS workflow against OpenBSD -current.
    name: "openbsd-current-upstream"
    if: github.repository != 'openssh/openssh-portable-selfhosted' && (vars.RUN_ONLY_PLATFORM == '' || vars.RUN_ONLY_PLATFORM == 'openbsd')
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@main

    - name: start OpenBSD VM
      uses: vmactions/openbsd-vm@18edb32f4e48dae5865d7b8b3a9587bc01218a20 # v1
      with:
        copyback: false
        nat: |
          "20022": "22"
        usesh: true
        prepare: |
          timeout 600 pkg_add git || pkg_add git
          useradd -g wobj -m builder
          echo "permit nopass keepenv root" >/etc/doas.conf
          echo "permit nopass keepenv builder" >>/etc/doas.conf
          ls -l /etc/doas.conf
          chown root:wheel /etc/doas.conf
          chmod 644 /etc/doas.conf
          touch /etc/ssh/ssh_known_hosts

    - name: fetch sysupgrade version
      run: |
        ver=$(curl -s https://cdn.openbsd.org/pub/OpenBSD/snapshots/amd64/BUILDINFO)
        echo "SNAPSHOT_VERSION=${ver}" >> $GITHUB_ENV
    - name: check for cached sysupgrade
      id: cache-sysupgrade
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        key: openbsd-sysupgrade ${{ env.SNAPSHOT_VERSION }}
        path: /tmp/_sysupgrade/
    - name: push sysupgrade from cache to VM
      if: steps.cache-sysupgrade.outputs.cache-hit == 'true'
      run: rsync -av /tmp/_sysupgrade/ openbsd:/home/_sysupgrade/
    - name: upgrade to latest snapshot
      run: ssh -q openbsd sysupgrade -s -k || true
    - name: wait for upgrade
      run: |
        SECONDS=0; sleep 10; while ! ssh -q -oConnectTimeout=1 openbsd true; do sleep 10; echo waited ${SECONDS}s; done
        ssh -q openbsd uname -a
    - name: retrieve sysupgrade from VM to cache
      if: steps.cache-sysupgrade.outputs.cache-hit != 'true'
      run: |
        mkdir -p /tmp/_sysupgrade/
        rsync -av openbsd:/home/_sysupgrade/ /tmp/_sysupgrade/
    - name: save sysupgrade to cache
      if: steps.cache-sysupgrade.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        key: openbsd-sysupgrade ${{ env.SNAPSHOT_VERSION }}
        path: /tmp/_sysupgrade/

    - name: Clone liboqs
      shell: openbsd {0}
      run: |
        cd $GITHUB_WORKSPACE
        chown -R builder .
        doas -u builder bash ./oqs-scripts/clone_liboqs.sh
    - name: Build liboqs
      shell: openbsd {0}
      run: |
        cd $GITHUB_WORKSPACE
        chown -R builder .
        doas -u builder env LIBOQS_CMAKE_ARGS="-DOQS_BUILD_ONLY_LIB=ON -DOQS_USE_OPENSSL=OFF" \
          bash ./oqs-scripts/build_liboqs.sh
        (cd oqs/lib && ln -sf liboqs.so.*.*.* liboqs.so)
    - name: Build OpenSSH
      shell: openbsd {0}
      run: |
        cd $GITHUB_WORKSPACE
        chown -R builder .
        doas -u builder env PATH="/usr/local/bin:$PATH" OPENSSL_SYS_DIR=/usr \
          AUTOCONF_VERSION=2.71 AUTOMAKE_VERSION=1.16 VMCI=true WITH_OPENSSL=true \
          bash ./oqs-scripts/build_openssh.sh
    - name: Run tests documented to pass
      shell: openbsd {0}
      # TODO: Investigate further ssh-tty regression test for openbsd.
      run: |
        rsync -a openbsd:/usr/obj/regress/usr.bin/ssh/ regress-logs/
        for i in regress-logs/failed*.log; do echo ===; echo LOGFILE: $i; echo ===; cat $i; echo; done
    - name: save logs
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # main
      with:
        name: openbsd-current-upstream-logs
        path: regress-logs/*.log


  solaris:
    name: "solaris-${{ matrix.target }}"
    if: github.repository != 'openssh/openssh-portable-selfhosted' && (vars.RUN_ONLY_PLATFORM == '' || vars.RUN_ONLY_PLATFORM == 'solaris')
    strategy:
      fail-fast: false
      matrix:
        target:
          - "11.4-gcc"
          - "11.4-clang-19"
        config: [default]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # main
    - name: autoreconf
      run: sh -c autoreconf

    - name: start Solaris ${{ matrix.target }} VM
      uses: vmactions/solaris-vm@d30dd6c228c8661ade859e36ead7660b9a62efcc # v1
      with:
        release: ${{ matrix.target }}
        usesh: true
        prepare: |
          echo Setting up user builder.
          useradd -m builder
          openssl rand -base64 9 >$GITHUB_WORKSPACE/regress/password
          chown builder $GITHUB_WORKSPACE/regress/password
          pw=$(tr -d '\n' <$GITHUB_WORKSPACE/regress/password | openssl passwd -6 -stdin)
          passwd -p "$pw" builder
          echo Setting up sudo.
          sed -e "s/^root.*ALL$/root ALL=(ALL) NOPASSWD: ALL/" /etc/sudoers >>/tmp/sudoers
          mv /tmp/sudoers /etc/sudoers
          echo "builder ALL=(ALL) NOPASSWD: ALL" >/etc/sudoers.d/builder
          echo 'Testing sudo config for root->builder.'
          sudo -u builder id
          echo 'Testing sudo config for builder->root.'
          sudo -u builder sudo id
          echo Creating directories.
          mkdir -p /var/empty /usr/local/etc
          cp $GITHUB_WORKSPACE/moduli /usr/local/etc/moduli

    - name: Clone liboqs
      shell: solaris {0}
      run: |
        cd $GITHUB_WORKSPACE
        sudo -u builder env SUDO=sudo make tests

    - name: "PAM: configure"
      shell: solaris {0}
      run: cd $GITHUB_WORKSPACE && sudo -u builder ./configure --with-pam
    - name: "PAM: make clean"
      shell: solaris {0}
      run: cd $GITHUB_WORKSPACE && sudo -u builder make clean
    - name: "PAM: make"
      shell: solaris {0}
      run: cd $GITHUB_WORKSPACE && sudo -u builder make
    - name: "PAM: make t-exec UsePAM=no"
      shell: solaris {0}
      run: |
        cd $GITHUB_WORKSPACE
        sudo -u builder env SUDO=sudo make t-exec
    - name: "PAM: make t-exec UsePAM=yes"
      shell: solaris {0}
      run: |
        cd $GITHUB_WORKSPACE
        cp regress/password regress/kbdintpw
        sudo -u builder env SUDO=sudo TEST_SSH_SSHD_CONFOPTS="UsePam yes" make t-exec
